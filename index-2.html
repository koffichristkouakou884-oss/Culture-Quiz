html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;min-height:100vh;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:12px}
h1{font-size:2.2rem;margin:16px 0 0}h2{font-size:1.3rem;margin:8px 0 12px}

.fb p{margin:6px 0 12px}.up{margin-top:6px;font-weight:700;color:var(--primary)}

</style>

,"explanation":"Ils représentent les cinq continents unis par l’olympisme."},{"category":"Sport","text":"De quel pays vient le sprinteur Usain Bolt ?","options":["La Jamaïque","Le Kenya","Les États-Unis","Trinité-et-Tobago"],"answer":0,"explanation":"Il a remporté huit titres olympiques, sur 100 m, 200 m et en relais."},{"category":"Sport","text":"Quel est le record du monde du 100 mètres, détenu par Usain Bolt ?","options":["9,78 s","9,69 s","9,58 s","9,48 s"],"answer":2,"explanation":"Il l’a établi à Berlin en 2009."},{"category":"Sport","text":"Quelle ville a accueilli les Jeux olympiques d’été de 2024 ?","options":["Los Angeles","Paris","Rome","Tokyo"],"answer":1,"explanation":"Los Angeles accueillera ceux de 2028."},{"category":"Sport","text":"Quel tournoi de tennis se joue sur terre battue, à Paris ?","options":["Wimbledon","L’US Open","L’Open d’Australie","Roland-Garros"],"answer":3,"explanation":"C’est le seul tournoi du Grand Chelem sur terre battue."},{"category":"Sport","text":"Sur quelle surface se joue le tournoi de Wimbledon ?","options":["Le dur","La terre battue","Le gazon","Le synthétique"],"answer":2,"explanation":"C’est le plus ancien tournoi de tennis du monde."},{"category":"Sport","text":"Combien de joueurs une équipe de basket-ball a-t-elle sur le terrain ?","options":["5","6","11","7"],"answer":0,"explanation":"Cinq joueurs par équipe, soit dix sur le terrain."},{"category":"Sport","text":"Combien de joueurs sur le terrain dans une équipe de rugby à XV ?","options":["7","13","11","15"],"answer":3,"explanation":"Le rugby à XIII en compte 13 et le rugby à 7 en compte 7."},{"category":"Sport","text":"De quelle couleur est le maillot du leader du Tour de France ?","options":["Bleu","Jaune","Vert","Rouge"],"answer":1,"explanation":"Le maillot jaune existe depuis 1919."},{"category":"Sport","text":"Quel boxeur légendaire était surnommé « The Greatest » ?","options":["Mike Tyson","George Foreman","Mohamed Ali","Joe Frazier"],"answer":2,"explanation":"Il a été trois fois champion du monde des poids lourds."},{"category":"Sport","text":"Avec quel club anglais l’Ivoirien Yaya Touré a-t-il remporté la Premier League ?","options":["Liverpool","Chelsea","Arsenal","Manchester City"],"answer":3,"explanation":"Il a été sacré avec les Citizens, notamment en 2012 et 2014."},{"category":"Sport","text":"Quel pays a remporté la Coupe du monde féminine de football en 2023 ?","options":["Les États-Unis","L’Espagne","La Suède","L’Angleterre"],"answer":1,"explanation":"Elle a battu l’Angleterre 1-0 en finale."},{"category":"Sport","text":"Qui est le meilleur buteur de l’histoire de la Coupe du monde masculine ?","options":["Pelé","Just Fontaine","Ronaldo","Miroslav Klose"],"answer":3,"explanation":"L’Allemand Klose a marqué 16 buts en quatre Coupes du monde."},{"category":"Sport","text":"Combien de Ballons d’or Lionel Messi a-t-il remportés ?","options":["5","6","8","7"],"answer":2,"explanation":"C’est le record absolu, loin devant les autres joueurs."},{"category":"Sport","text":"Pour quelle équipe de NBA Michael Jordan a-t-il remporté six titres ?","options":["Les Celtics","Les Chicago Bulls","Les Lakers","Les Knicks"],"answer":1,"explanation":"Il a gagné six titres entre 1991 et 1998."}];
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let xp = Number(LS.get('cq_xp', 0)) || 0;
let seen = new Set(LS.get('cq_seen', []));
const TITLES = ['Débutant','Curieux','Explorateur','Connaisseur','Savant','Érudit','Maître','Sage','Légende'];
const xpForLevel = n => 50 * n * (n - 1);
const levelFromXp = x => { let l = 1; while (x >= xpForLevel(l + 1)) l++; return l; };
const title = l => TITLES[Math.min(l - 1, TITLES.length - 1)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save = () => { LS.set('cq_xp', xp); LS.set('cq_seen', [...seen]); };
const qid = q => { let h = 0x811c9dc5; for (let i = 0; i < q.text.length; i++) { h ^= q.text.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function pick(count) {
  let pool = Q.filter(q => !seen.has(qid(q)));
  if (pool.length < count * 3) { seen.clear(); pool = Q.slice(); }
  const by = {};
  pool.forEach(q => (by[q.category] = by[q.category] || []).push(q));
  Object.values(by).forEach(shuffle);
  const out = []; let last = null;
  while (out.length < count) {
    let cats = Object.keys(by).filter(c => by[c].length);
    if (!cats.length) break;
    if (cats.length > 1 && last) cats = cats.filter(c => c !== last);
    const c = cats[Math.floor(Math.random() * cats.length)];
    out.push(by[c].pop()); last = c;
  }
  return out;
}

const app = document.getElementById('app');
let g;

function levelBar() {
  const l = levelFromXp(xp), a = xpForLevel(l), b = xpForLevel(l + 1);
  const pct = Math.round((xp - a) / (b - a) * 100);
  return `<div class="lvl"><div class="lvl-top"><span class="badge">${l}</span><strong>Niveau ${l} · ${title(l)}</strong><span>${xp} XP</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><small>${b - xp} XP avant le niveau ${l + 1}</small></div>`;
}

function home() {
  app.innerHTML = `<h1>Culture Quiz</h1><p class="sub">Des questions variées sur le monde d’hier et d’aujourd’hui.</p><div class="card">${levelBar()}</div><div class="spacer"></div><button class="btn" id="play">▶ Jouer</button><p class="foot">${Q.length} questions · 10 par partie</p>`;
  document.getElementById('play').onclick = startGame;
}

function startGame() {
  g = { qs: pick(10), i: 0, score: 0, streak: 0, best: 0, gained: 0, startXp: xp, sel: null, gain: 0, up: null };
  quiz();
}

function quiz() {
  const q = g.qs[g.i], n = g.qs.length, answered = g.sel !== null;
  const opts = q.options.map((o, i) => {
    let c = 'opt';
    if (answered) { if (i === q.answer) c += ' ok'; else if (i === g.sel) c += ' ko'; }
    return `<button class="${c}" data-i="${i}" ${answered ? 'disabled' : ''}>${esc(o)}</button>`;
  }).join('');
  let fb = '';
  if (answered) {
    const good = g.sel === q.answer;
    fb = `<div class="fb"><strong>${good ? 'Bonne réponse ! +' + g.gain + ' XP 🎉' : 'Raté !'}</strong>${g.up ? '<div class="up">Niveau supérieur ! Tu passes au niveau ' + g.up + ' · ' + title(g.up) + ' 🏆</div>' : ''}<p>${esc(q.explanation)}</p></div>`;
  }
  app.innerHTML = `<div class="top"><span>Question ${g.i + 1} / ${n}</span><span>Score : ${g.score}</span></div><div class="card">${levelBar()}</div><div class="streak">Série : ${g.streak} 🔥</div><div><h2>${esc(q.text)}</h2>${opts}${fb}</div>${answered ? `<button class="btn" id="next">${g.i + 1 >= n ? 'Voir le résultat' : 'Suivant'}</button>` : ''}`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(Number(b.dataset.i)));
  const nx = document.getElementById('next');
  if (nx) nx.onclick = next;
}

function choose(i) {
  if (g.sel !== null) return;
  const q = g.qs[g.i], old = levelFromXp(xp);
  g.sel = i; seen.add(qid(q));
  if (i === q.answer) {
    g.score++; g.streak++; g.best = Math.max(g.best, g.streak);
    g.gain = 10 + (g.streak >= 3 ? 5 : 0); xp += g.gain; g.gained += g.gain;
    const nl = levelFromXp(xp); if (nl > old) g.up = nl;
  } else { g.streak = 0; g.gain = 0; }
  save(); quiz();
}

function next() {
  if (g.i + 1 >= g.qs.length) return result();
  g.i++; g.sel = null; g.gain = 0; g.up = null; quiz(); window.scrollTo(0, 0);
}

function result() {
  const r = g.score / g.qs.length;
  const msg = r === 1 ? 'Parfait ! Tu es un vrai puits de science 🏆' : r >= 0.7 ? 'Excellent travail 👏' : r >= 0.4 ? 'Pas mal, continue comme ça 💪' : 'Courage, la prochaine fois sera meilleure 🌱';
  const nl = levelFromXp(xp), ol = levelFromXp(g.startXp);
  app.innerHTML = `<div class="spacer"></div><p class="big">${g.score} / ${g.qs.length}</p><p class="center"><strong>${msg}</strong></p><p class="center">+${g.gained} XP · Meilleure série : ${g.best}</p>${nl > ol ? '<p class="center up">Niveau supérieur ! Tu es maintenant niveau ' + nl + ' · ' + title(nl) + ' 🏆</p>' : ''}<div class="card">${levelBar()}</div><div class="spacer"></div><button class="btn" id="again">Rejouer</button><button class="btn alt" id="home">Retour à l’accueil</button>`;
  document.getElementById('again').onclick = startGame;
  document.getElementById('home').onclick = home;
  window.scrollTo(0, 0);
}

home();
</script>
